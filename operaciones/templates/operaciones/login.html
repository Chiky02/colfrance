{% extends "operaciones/base.html" %}

{% block titulo %}Entrar · Colfrance{% endblock %}

{% block cuerpo %}
<main class="acceso">
  <section class="tarjeta entrada">
    <p class="marca">Colfrance</p>
    <h1>Registro de planta</h1>
    
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <div class="campo">
          {{ field.label_tag }}
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
      {{ form.non_field_errors }}
      <button type="submit">Entrar</button>
    </form>
  </section>
</main>
{% endblock %}
